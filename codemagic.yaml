workflows:
  android-apk-build:
    name: Build Android Debug APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Generate Gradle Wrapper and Build APK
        script: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug -x validateSigningDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - "**/*.apk"
      
