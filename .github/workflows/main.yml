name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create Dummy google-services.json
      run: |
        mkdir -p app
        echo '{"project_info": {"project_number": "123456789", "project_id": "datacash-pk"}, "client": [{"client_info": {"mobilesdk_app_id": "1:123456789:android:123456"}, "oauth_client": [], "api_key": [{"current_key": "AIzaSyDummyKeyForBuild12345"}]}]}' > app/google-services.json

    - name: Create Default Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Unsigned APK
      run: ./gradlew assembleDebug -x validateSigningDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
