name: Build Android WebAPK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web App
        run: |
          if [ -f package.json ]; then npm install && npm run build; fi

      - name: Package App Files
        run: |
          mkdir -p output
          zip -r output/DataCash-PK-WebBundle.zip . -x "*.git*"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DataCash-PK-App
          path: output/DataCash-PK-WebBundle.zip
          
