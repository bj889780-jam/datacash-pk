name: Build Android WebAPK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Web App
        run: |
          if [ -f package.json ]; then npm install && npm run build; fi

      - name: Zip Files Correctly for WebIntoApp
        run: |
          if [ -d dist ]; then
            cd dist && zip -r ../DataCash-PK-App.zip .
          elif [ -d build ]; then
            cd build && zip -r ../DataCash-PK-App.zip .
          else
            zip -r DataCash-PK-App.zip . -x "*.git*"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DataCash-PK-App
          path: DataCash-PK-App.zip
          
